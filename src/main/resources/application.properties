spring.application.name=heladeria-api

# Servidor y Codificación UTF-8
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Base de datos: H2 por defecto para desarrollo local, o PostgreSQL mediante variables de entorno (Docker / Producción)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:heladeriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Consola H2: apagada por defecto (es un vector de ataque). Solo para desarrollo local: H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# El SQL en el log llena el disco y puede exponer datos: solo para depurar (SHOW_SQL=true)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway: desactivado por defecto (H2 local/tests). En Docker/producción se activa por variable de entorno.
# Una base existente sin historial se toma como línea base en V1 y solo recibe las migraciones posteriores.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Respaldos automáticos (la retención/borrado de respaldos viejos es manual, a cargo del operador)
app.backup.programado.enabled=${APP_BACKUP_PROGRAMADO_ENABLED:true}
app.backup.cron=${APP_BACKUP_CRON:0 0 3 * * *}
app.backup.max-horas=${APP_BACKUP_MAX_HORAS:26}
app.backup.verificar-restauracion=${APP_BACKUP_VERIFICAR_RESTAURACION:true}
# Directorio fuera del servidor (NAS, disco USB, montaje de red). Vacío = sin copia externa.
app.backup.copia-externa-dir=${APP_BACKUP_COPIA_EXTERNA_DIR:}

# Licencia: margen para ajustes normales de hora (NTP, horario de verano) antes de considerar que el reloj retrocedió
app.licencia.tolerancia-reloj-minutos=${APP_LICENCIA_TOLERANCIA_RELOJ_MINUTOS:10}

# Clave AES-256 (base64, 32 bytes) para cifrar secretos guardados en la base (p. ej. contraseñas de impresoras).
# Obligatoria con PostgreSQL. Generar con: openssl rand -base64 32
app.seguridad.clave-cifrado=${APP_CIFRADO_CLAVE:}

# Swagger OpenAPI: apagado por defecto (publica el mapa completo de la API). Para desarrollo: SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Seguridad y JWT
# Clave HMAC-SHA256 (mínimo 256 bits / 32 bytes)
app.jwt.secret=${APP_JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWhlbGFkZXJpYS1hcGktMjU2LWJpdHM=}
# Token de acceso corto (15 min); se renueva solo con el token de refresco (12 h de inactividad máxima)
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:43200000}

# CORS (orígenes permitidos separados por coma o * para desarrollo)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Contraseñas iniciales de admin/owner. Vacías: en desarrollo (H2) se usan admin123/owner123; con PostgreSQL se genera
# una contraseña aleatoria (se muestra una sola vez en el log) y el usuario debe cambiarla al primer ingreso.
app.security.default-admin-password=${APP_SECURITY_DEFAULT_ADMIN_PASSWORD:}
app.security.default-owner-password=${APP_SECURITY_DEFAULT_OWNER_PASSWORD:}

# Zona horaria por defecto (Paraguay / America/Asuncion)
spring.jackson.time-zone=America/Asuncion

# Tamaño máximo de subida para archivos de respaldo (.dump / .sql)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


# --- Pool de conexiones ---
# La auditoría usa una transacción nueva (REQUIRES_NEW), o sea una segunda conexión mientras la principal sigue abierta.
# Si todas las conexiones del pool estuvieran tomadas por transacciones principales, ninguna podría pedir la segunda
# y todo quedaría colgado. Por eso el pool (40) es mayor que las peticiones simultáneas que Tomcat acepta (30),
# y deja margen para el spooler de impresión y los respaldos. PostgreSQL admite 100 conexiones por defecto.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:40}
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:30}
