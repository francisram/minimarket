spring.application.name=heladeria-api

# Servidor
server.port=8080

# Base de datos: H2 por defecto para desarrollo local, o PostgreSQL mediante variables de entorno (Docker / Producción)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:heladeriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Consola H2 (activa en modo local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Seguridad y JWT
# Clave HMAC-SHA256 (mínimo 256 bits / 32 bytes)
app.jwt.secret=${APP_JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWhlbGFkZXJpYS1hcGktMjU2LWJpdHM=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS (orígenes permitidos separados por coma o * para desarrollo)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Contraseñas por defecto para semillas iniciales (cambiar en producción)
app.security.default-admin-password=${APP_SECURITY_DEFAULT_ADMIN_PASSWORD:admin123}
app.security.default-owner-password=${APP_SECURITY_DEFAULT_OWNER_PASSWORD:owner123}

