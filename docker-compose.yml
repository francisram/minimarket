services:
  db:
    image: postgres:16-alpine
    container_name: heladeria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heladeriadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Asuncion
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heladeriadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heladeria-api
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      TZ: America/Asuncion
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/heladeriadb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_ENABLED: "true"
      # Orígenes CORS permitidos (el front en nginx usa el proxy /api, o sea mismo origen)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8086,https://localhost:8443}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
