services:
  db:
    image: postgres:16-alpine
    container_name: heladeria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heladeriadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Asuncion
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heladeriadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heladeria-api
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      TZ: America/Asuncion
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/heladeriadb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_ENABLED: "true"
      # Secretos: se leen del archivo .env (ver .env.example). Sin APP_JWT_SECRET el compose no arranca.
      APP_JWT_SECRET: "${APP_JWT_SECRET:?Defina APP_JWT_SECRET en el archivo .env - copie .env.example y genere uno con openssl rand -base64 48}"
      APP_SECURITY_DEFAULT_ADMIN_PASSWORD: ${APP_SECURITY_DEFAULT_ADMIN_PASSWORD:-}
      APP_SECURITY_DEFAULT_OWNER_PASSWORD: ${APP_SECURITY_DEFAULT_OWNER_PASSWORD:-}
      # Respaldos automáticos diarios (03:00). La copia externa solo se activa si se define BACKUP_EXTERNAL_DIR
      # (ruta del host: NAS, disco USB o montaje de red; debe ser escribible por el usuario de la API).
      APP_BACKUP_COPIA_EXTERNA_DIR: ${BACKUP_EXTERNAL_DIR:+/app/backups-externos}
      # Orígenes CORS permitidos (el front en nginx usa el proxy /api, o sea mismo origen)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8086,https://localhost:8443}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    volumes:
      # Sin este volumen los respaldos vivían dentro del contenedor y se perdían al recrearlo
      - backups_data:/app/backups
      - ${BACKUP_EXTERNAL_DIR:-./backups-externos}:/app/backups-externos
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  backups_data:
