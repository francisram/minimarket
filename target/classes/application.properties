spring.application.name=minimarketbase
# Conexión DB
spring.datasource.url=jdbc:postgresql://localhost:5432/minisuperdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool Hikari
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPoolSuper

management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.mappings.enabled=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info,mappings,beans,env
management.endpoint.health.show-details=always
management.endpoint.mappings.enabled=true

# Para ver todos los endpoints disponibles
management.endpoints.web.exposure.include=*

